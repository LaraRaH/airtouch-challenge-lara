{% extends 'core/base.html' %}
{% block content %}
<h1>{{ obj.name }} ({{ obj.unit }})</h1>
<p><a href="{% url 'ni_update' obj.pk %}">Editar</a></p>
<form method="post" action="{% url 'ni_delete' obj.pk %}">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
</form>
<a href="{% url 'ni_list' %}">Back</a>
{% endblock %}
